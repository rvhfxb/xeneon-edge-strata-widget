name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node scripts/test-upstream.cjs --upstream
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/test-helper.ps1
      - run: npm run validate
      - run: npm run verify
      - run: npm run package
